<header class="header" id="top">
    <nav class="nav-main">
        <a href="{% url 'home' %}" class="nav-item nav-logo" aria-label="Amazon Home">
            <span class="logo-brand">amazon</span>
            <span class="logo-suffix">.in</span>
        </a>

        <div class="nav-item nav-location">
            <div class="nav-location-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </div>
            <div class="nav-location-text">
                <span class="nav-line-1">Deliver to</span>
                <span class="nav-line-2">Select your address</span>
            </div>
        </div>

        <div class="nav-search">
            <form class="nav-search-form" action="#" method="get">
                <div class="search-category-wrapper">
                    <select class="search-select" name="category" aria-label="Select search category">
                        <option value="all" selected>All</option>
                        <option value="alexa">Alexa Skills</option>
                        <option value="appliances">Appliances</option>
                        <option value="apps">Apps & Games</option>
                        <option value="books">Books</option>
                        <option value="clothing">Clothing & Accessories</option>
                        <option value="computers">Computers & Accessories</option>
                        <option value="electronics">Electronics</option>
                        <option value="home">Home & Kitchen</option>
                        <option value="mobiles">Mobiles</option>
                        <option value="prime">Prime Video</option>
                    </select>
                    <span class="select-caret" aria-hidden="true">&#9662;</span>
                </div>

                <input 
                    type="text" 
                    name="query" 
                    class="search-input" 
                    placeholder="Search Amazon.in" 
                    aria-label="Search Amazon" 
                    autocomplete="off"
                >

                <button type="submit" class="search-button" aria-label="Go">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </form>
        </div>

        <div class="nav-item nav-language">
            <span class="nav-flag" aria-hidden="true">&#x1F1EE;&#x1F1F3;</span>
            <span class="nav-lang-code">EN</span>
            <span class="nav-caret" aria-hidden="true">&#9662;</span>
        </div>

        <a href="#" class="nav-item nav-account">
            <span class="nav-line-1">Hello, sign in</span>
            <div class="nav-line-2-group">
                <span class="nav-line-2">Account & Lists</span>
                <span class="nav-caret" aria-hidden="true">&#9662;</span>
            </div>
        </a>

        <a href="#" class="nav-item nav-orders">
            <span class="nav-line-1">Returns</span>
            <span class="nav-line-2">& Orders</span>
        </a>

        <a href="#" class="nav-item nav-cart" aria-label="Shopping Cart">
            <div class="cart-icon-wrapper">
                <span class="cart-count">0</span>
                <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
            </div>
            <span class="cart-title">Cart</span>
        </a>
    </nav>

    <nav class="nav-sub">
        <div class="nav-sub-left">
            <a href="#" class="nav-sub-item nav-menu-all">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                <span>All</span>
            </a>
            <a href="#" class="nav-sub-item">Fresh</a>
            <a href="#" class="nav-sub-item">Amazon miniTV</a>
            <a href="#" class="nav-sub-item">Sell</a>
            <a href="#" class="nav-sub-item">Best Sellers</a>
            <a href="#" class="nav-sub-item">Today's Deals</a>
            <a href="#" class="nav-sub-item">Mobiles</a>
            <a href="#" class="nav-sub-item">Customer Service</a>
            <a href="#" class="nav-sub-item">Electronics</a>
            <a href="#" class="nav-sub-item">Home & Kitchen</a>
            <a href="#" class="nav-sub-item">Fashion</a>
        </div>
        <div class="nav-sub-right">
            <a href="#" class="nav-sub-item nav-sub-promo">Shopping made easy | Download the App</a>
        </div>
    </nav>
</header>
